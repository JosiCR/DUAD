<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>PawStore</title>

        <link rel="stylesheet" href="../css/main.css">
    </head>
    <body>
        <header>

            <div class="navbar">

                <div class="logo">
                    <h1>PawStore</h1>
                </div>
                <nav>
                    <a href="index.html" class="active">Inicio</a>
                    <a href="catalog.html">Productos</a>
                    <a href="#about">Acerca de</a>
                    <a href="login.html" class="active">Iniciar Sesion</a>
                </nav>

            </div>


        </header>

        <main>
            <section class="login-container">

                <h2>Iniciar Sesion</h2>
                <p>Ingresa tus datos para iniciar sesion</p>

                <form>

                    <label>Correo Electronico</label>
                    <input 
                    type="email" 
                    placeholder="Ingresa tu correo" 
                    id="email">

                    <label>Contraseña</label>
                    <input 
                    type="password" 
                    placeholder="Ingresa tu Contraseña" 
                    id="password">

                    <button id="loginBtn">Ingresar</button>

                </form>

                <a href="register.html" class="register-link">
                    ¿No tienes cuenta? Regístrate
                </a>

            </section>

        </main>

        <footer>

            <p>© 2026 PawStore. Todos los derechos reservados.</p>

        </footer>

    </body>
</html>
