<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PawStore | Registrarse</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">

</head>

<body>

    <header>

        <div class="navbar">

            <div class="logo">

                <h1>PawStore</h1>

            </div>

            <nav>

                <a href="index.html">🏠 Inicio</a>

                <a href="catalog.html">🐾 Catálogo</a>

                <a href="index.html#about">ℹ Acerca de</a>

                <a href="login.html">🔐 Iniciar sesión</a>

            </nav>

        </div>

    </header>


    <main>

        <section class="auth-container">

            <h2>Regístrate</h2>

            <p>Ingresa tus datos para crear una cuenta.</p>


            <form id="registerForm">

                <label for="name">Nombre</label>

                <input type="text" id="name" placeholder="Ingresa tu nombre">


                <label for="email">Correo electrónico</label>

                <input type="text" id="email" placeholder="Ingresa tu correo">


                <label for="password">Contraseña</label>

                <input type="password" id="password" placeholder="Ingresa tu contraseña">


                <label for="confirmPassword">Confirmar contraseña</label>

                <input type="password" id="confirmPassword" placeholder="Confirma tu contraseña">


                <button type="submit" id="registerBtn">👤 Crear cuenta</button>

                <ul id="errorMessage"></ul>

            </form>


            <a href="login.html" class="register-link">¿Ya tienes cuenta? Inicia sesión</a>

        </section>

    </main>


    <footer>

        <p>© 2026 PawStore. Todos los derechos reservados.</p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="../js/services/authService.js"></script>

    <script src="../js/auth/register.js"></script>

</body>

</html>
