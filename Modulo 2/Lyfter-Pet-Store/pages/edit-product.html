<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PawStore | Gestionar producto</title>

    <link rel="stylesheet" href="../css/main.css">

    <link rel="stylesheet" href="../css/edit-product.css">

</head>

<body>

    <header>

        <div class="navbar">

            <div class="logo">

                <h1>PawStore</h1>

            </div>

            <nav>

                <a href="index.html">🏠 Inicio</a>

                <a href="catalog.html">🐾 Catálogo</a>

                <a href="admin.html" id="adminNavigationLink" class="active">⚙ Administrador</a>

            </nav>

        </div>

    </header>


    <main>

        <section class="product-form-section">

            <div class="product-form-header">

                <h2 id="formTitle">Agregar producto</h2>

                <p id="formDescription">Completa la información del nuevo producto.</p>

            </div>


            <form id="productForm">

                <div class="form-group">

                    <label for="productName">Nombre del producto</label>

                    <input type="text" id="productName" required>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="productCategory">Categoría</label>

                        <input type="text" id="productCategory" required>

                    </div>


                    <div class="form-group">

                        <label for="productPrice">Precio en colones (₡)</label>

                        <input type="number" id="productPrice" min="1" step="1" required>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="productStock">Stock</label>

                        <input type="number" id="productStock" min="0" step="1" required>

                    </div>


                    <div class="form-group">

                        <label for="productImage">Ruta de la imagen</label>

                        <input type="text" id="productImage" placeholder="../assets/images/product.png" required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="productDescription">Descripción</label>

                    <textarea id="productDescription" rows="5" required></textarea>

                </div>


                <div class="product-form-actions">

                    <button type="button" id="cancelButton" class="cancel-button">Cancelar</button>

                    <button type="submit" id="saveProductButton" class="save-product-button">Guardar producto</button>

                </div>

            </form>

        </section>

    </main>


    <footer>

        <p>© 2026 PawStore. Todos los derechos reservados.</p>

    </footer>


    <script src="../js/services/authService.js"></script>

    <script src="../js/services/productService.js"></script>

    <script src="../js/admin/edit.product.js"></script>

</body>

</html>
